<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Norimaru</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- фиксированный хедер -->
  <header class="header">
    <div class="contact">
      <button class="contact__btn" type="button" data-i18n-aria="contact.label" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.2 9.2 14 3.8v16.4L3.2 14.8V9.2Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M14 8.2c1.7.9 2.8 2.2 2.8 3.8s-1.1 2.9-2.8 3.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M16.6 6.2c2.4 1.4 3.9 3.4 3.9 5.8s-1.5 4.4-3.9 5.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="contact__menu">
        <button class="contact__item" type="button" data-tip="Telegram" aria-label="Telegram">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm4.7 6.9-1.4 6.7c-.1.5-.4.6-.8.4l-2.2-1.6-1.1 1c-.1.1-.2.2-.5.2l.2-2.3 4.1-3.7c.2-.2 0-.3-.2-.1l-5.1 3.2-2.2-.7c-.5-.1-.5-.5.1-.7l8.6-3.3c.4-.2.8.1.5.9Z"/>
          </svg>
        </button>
        <button class="contact__item" type="button" data-tip="Gmail" aria-label="Gmail">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 4.2c2.3 0 4.2.8 5.5 2.1l-1.3 1.3A5.6 5.6 0 0 0 12 8.1c-2.4 0-4.4 2-4.4 4.4S9.6 17 12 17c2.2 0 3.7-1.2 4.1-3h-4.1v-1.8h6.2c.1.4.1.8.1 1.3 0 3.7-2.5 6.4-6.3 6.4A6.6 6.6 0 0 1 5.4 12.5 6.6 6.6 0 0 1 12 6.2Z"/>
          </svg>
        </button>
        <button class="contact__item" type="button" data-tip="Reddit" aria-label="Reddit">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6 9.3c.6 0 1.1.5 1.1 1.1 0 .4-.2.8-.5 1 .1.4.1.8.1 1.2 0 2.5-2.9 4.5-6.5 4.5S5.7 17.1 5.7 14.6c0-.4 0-.8.1-1.2a1.1 1.1 0 1 1 1.4-1.7c.7-.4 1.6-.7 2.6-.8l.9-2.8c.1-.2.3-.3.5-.3h.1l2 .4c.2-.5.7-.8 1.2-.8.8 0 1.4.6 1.4 1.4s-.6 1.4-1.4 1.4c-.5 0-1-.3-1.2-.8l-1.6-.3-.7 2.2c1 .1 1.9.4 2.6.8.3-.2.6-.3 1-.3Zm-7.2 2.4a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2Zm6.4 0a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2Zm-6.2 3.3c.5.5 1.6.9 3 .9s2.5-.4 3-.9c.2-.2.5-.1.6.1.2.2.1.5-.1.6-1.1 1.1-4.1 1.1-5.2 0a.4.4 0 0 1-.1-.6c.2-.2.5-.2.6.1Z"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="lang">
      <button class="lang__btn" type="button" data-i18n-aria="lang.label" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M3 12h18"></path>
          <path d="M12 3a14.5 14.5 0 0 1 0 18"></path>
          <path d="M12 3a14.5 14.5 0 0 0 0 18"></path>
        </svg>
      </button>
      <div class="lang__menu">
        <button class="lang__opt" type="button" data-lang="en">EN</button>
        <button class="lang__opt" type="button" data-lang="uk">UK</button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar sidebar--left">
      <div class="nav">
        <button class="nav__btn" type="button" data-i18n-aria="nav.menu" aria-expanded="false">
          <span class="nav__line"></span>
          <span class="nav__line"></span>
          <span class="nav__line"></span>
        </button>
        <nav class="nav__menu">
          <a href="#home" data-i18n="nav.home">Home</a>
          <a href="#about" data-i18n="nav.about">About me</a>
          <a href="#works" data-i18n="nav.works">My works</a>
          <a href="#contact" data-i18n="nav.contact">Contact information</a>
        </nav>
      </div>
    </aside>
    <main class="main"></main>
    <aside class="sidebar sidebar--right"></aside>
  </div>

  <!-- обычный футер -->
  <footer class="footer">
    <p data-i18n="footer.credit">This website was created by Norimaru</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
